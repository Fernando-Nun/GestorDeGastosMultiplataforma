kind = "mobile"
previewPath = "/mobile/"
title = "Ember para iPhone"
description = "Aplicación móvil de Ember para administrar gastos recurrentes y suscripciones desde el iPhone."
version = "1.0.0"
id = "artifacts/ember-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18973

[services.development]
run = "pnpm --filter @workspace/ember-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ember-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ember-mobile", "run", "serve" ]

[services.env]
PORT = "18973"
BASE_PATH = "/mobile/"
